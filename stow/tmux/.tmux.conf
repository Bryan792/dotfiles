# Portable tmux settings for the terminal profile.

set -g default-terminal "screen-256color"
set -g mouse on
set -g set-titles on
set -g set-titles-string '#H:#S.#I.#P #W #T'
set-window-option -g alternate-screen on

# Keep the existing screen-style prefix and navigation bindings.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a last-window
bind c new-window
bind C-c new-window
bind d detach
bind | split-window -h
bind - split-window -v
bind C-l refresh-client
bind l refresh-client
bind n next-window
bind C-n next-window
bind p previous-window
bind C-p previous-window
bind w list-windows
bind C-w list-windows
bind k confirm-before 'kill-window'
bind K confirm-before 'kill-window'
